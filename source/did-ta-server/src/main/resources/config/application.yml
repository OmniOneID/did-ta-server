spring:
  application:
    name: Tas
  profiles:
    active: dev, test
    group:
        dev:
          - auth
          - databases
          - wallet
          - logging
          - spring-docs
          - notification
          - tas
          - setup
          - blockchain
        sample:
          - auth
          - databases-sample
          - wallet
          - logging
          - spring-docs
          - notification
          - tas
          - setup
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: "never"

server:
  port: 8090
